[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breast-cancer-detector"
version = "0.1.0"
description = "Breast cancer classification project for malignant vs. benign tumor detection."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Your Name" }]
license = { text = "MIT" }
dependencies = [
    "pandas==2.2.3",
    "numpy==2.4.6",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "scikit-learn==1.5.2",
    "jupyter==1.1.1",
    "joblib==1.5.3",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.5.0",
    "ipykernel>=6.29.0",
    "pytest==8.4.1",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
