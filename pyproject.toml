[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breast-cancer-detector"
version = "0.1.0"
description = "Educational breast cancer classification project using the Wisconsin Diagnostic Breast Cancer dataset."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Subhanjan Bikram K C" }]
license = { text = "MIT" }
keywords = ["breast cancer", "machine learning", "classification", "scikit-learn", "healthcare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas==2.2.3",
    "numpy==1.26.4",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "scikit-learn==1.5.2",
    "jupyter==1.1.1",
    "joblib==1.5.3",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.5.0",
    "ipykernel>=6.29.0",
    "pytest==8.4.1",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
